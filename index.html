<head>

<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
.pwa-install{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;background:#111;color:#f4f4f4;border:1px solid #333;border-radius:999px;padding:6px 6px 6px 14px;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.pwa-install button{border:0;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.pwa-install .ok{background:#F28A0F;color:#111}.pwa-install .no{background:transparent;color:#aaa;padding:8px}
@media (min-width:821px){.pwa-install{bottom:24px}}</style>
<title>Car Solutions · Taller</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Archivo:wdth,wght@112..125,700;112..125,800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: riel lateral negro como la fachada del taller, letrero blanco con eslogan naranja; barra inferior en celular */
:root{
  --bg:#EFEEEC; --surface:#FFFFFF; --surface-2:#F5F4F2; --ink:#141414; --muted:#5E5E5E; --line:#DAD8D4;
  --accent:#F28A0F; --accent-ink:#141414; --steel:#A85400; --steel-soft:#FCEBD6;
  --rail:#111111; --rail-2:#1E1E1E; --rail-ink:#F4F4F4; --rail-muted:#9B9B9B;
  --ok:#1F7A4D; --ok-soft:#DFF1E7; --warn:#B26A00; --warn-soft:#FCEFD9; --bad:#B3261E; --bad-soft:#F9E1DF;
  --st-recibido:#8A6D00; --st-diagnostico:#2C5A79; --st-aprobacion:#C25E00; --st-reparacion:#6B4FA0; --st-listo:#1F7A4D; --st-entregado:#5E5E5E; --st-cancelado:#B3261E;
  --f-display:"Archivo","Arial Black",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --plate:#F2C200; --f-plate:"Barlow Condensed","Arial Narrow",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,20,20,.06),0 4px 14px rgba(20,20,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D; --surface:#181818; --surface-2:#212121; --ink:#EDEDED; --muted:#A3A3A3; --line:#2D2D2D;
  --accent:#F59A23; --accent-ink:#111111; --steel:#F5A94A; --steel-soft:#2A1F12;
  --rail:#050505; --rail-2:#1A1A1A; --rail-ink:#F4F4F4; --rail-muted:#8E8E8E;
  --ok:#5CC08C; --ok-soft:#163025; --warn:#E5A445; --warn-soft:#33281A; --bad:#EF7B72; --bad-soft:#3A1F1D;
  --st-recibido:#D9B23A; --st-diagnostico:#86B6D6; --st-aprobacion:#F59A23; --st-reparacion:#B49BE0; --st-listo:#5CC08C; --st-entregado:#A3A3A3; --st-cancelado:#EF7B72;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#181818; --surface-2:#212121; --ink:#EDEDED; --muted:#A3A3A3; --line:#2D2D2D;
  --accent:#F59A23; --accent-ink:#111111; --steel:#F5A94A; --steel-soft:#2A1F12;
  --rail:#050505; --rail-2:#1A1A1A; --rail-ink:#F4F4F4; --rail-muted:#8E8E8E;
  --ok:#5CC08C; --ok-soft:#163025; --warn:#E5A445; --warn-soft:#33281A; --bad:#EF7B72; --bad-soft:#3A1F1D;
  --st-recibido:#D9B23A; --st-diagnostico:#86B6D6; --st-aprobacion:#F59A23; --st-reparacion:#B49BE0; --st-listo:#5CC08C; --st-entregado:#A3A3A3; --st-cancelado:#EF7B72;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;font-stretch:112%;letter-spacing:0;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:20px} h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
a{color:var(--steel)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{padding:8px 8px 22px;border-bottom:1px solid var(--rail-2);margin-bottom:10px}
.sign{font-family:var(--f-display);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.95;letter-spacing:.01em;color:var(--rail-ink);font-size:22px;overflow-wrap:anywhere}
.sign-sub{display:block;margin-top:6px;font-family:var(--f-display);font-weight:700;font-stretch:112%;font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent)}
.brand .prod{display:block;margin-top:12px;font-size:11px;color:var(--rail-muted)}
.mtop{display:none}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 10px;border-radius:8px;cursor:pointer;color:var(--rail-muted);font-weight:600;text-align:left}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--rail-2);color:var(--rail-ink)}
.nav-btn[aria-current="page"]{background:var(--rail-2);color:var(--rail-ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn.cta{background:var(--accent);color:var(--accent-ink);margin:6px 0 10px}
.nav-btn.cta:hover{filter:brightness(.96)}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);opacity:.7;padding:12px 10px 4px}
.rail{overflow-y:auto}
.docrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px}
tr.rowlink{cursor:pointer}
tr.ent-ult td{background:var(--steel-soft)}
tr.rowlink:hover td{background:var(--surface-2)}
.rail .nav-btn{padding:8px 10px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-muted);padding:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
main{min-width:0;width:100%}
.main-in{padding-inline:28px;padding-block:24px 60px;max-width:1200px}
.tabbar{display:none}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main-in{padding-inline:16px;padding-block:14px 110px}
  .mtop{display:block;background:var(--rail);padding:12px 16px 10px;margin:0}
  .mtop .sign{font-size:18px}
  .mtop .sign-sub{font-size:8px;margin-top:4px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rail);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--rail-muted);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button.cta span.ic{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:42px;height:30px;display:grid;place-items:center}
  h1{font-size:26px}
}

/* Elements */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.split > .card + .card{margin-top:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--rail);border-color:var(--rail);color:var(--rail-ink)}
:root:not([data-theme="light"]) .btn.dark{border-color:var(--line)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:15px;color:var(--ink);font-weight:500;min-height:42px}
textarea.i{min-height:80px;resize:vertical;line-height:1.4}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--steel);outline-offset:0;border-color:var(--steel)}
.req::after{content:" *";color:var(--bad)}
.hint{font-weight:400;color:var(--muted);font-size:12px}

/* Placa colombiana */
.plate,.plate-input input{font-family:var(--f-plate)!important}
.plate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--plate);color:#16191D;border:2px solid #16191D;border-radius:6px;padding:2px 10px 1px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;line-height:1;box-shadow:inset 0 0 0 2px var(--plate),inset 0 0 0 3px rgba(0,0,0,.35)}
.plate .p{font-size:20px;white-space:nowrap}
.plate .c{font-size:7.5px;letter-spacing:.18em;margin-top:1px;font-family:var(--f-body);font-weight:700}
.plate.lg .p{font-size:40px} .plate.lg{padding:6px 18px 4px;border-width:3px;border-radius:9px}
.plate.lg .c{font-size:11px}
.plate-input{display:flex;flex-direction:column;align-items:center;background:var(--plate);border:3px solid #16191D;border-radius:10px;padding:8px 14px 6px;width:min(320px,100%);box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 4px rgba(0,0,0,.35)}
.plate-input input{all:unset;width:100%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:.12em;color:#16191D;text-transform:uppercase}
.plate-input input::placeholder{color:rgba(22,25,29,.35)}
.plate-input small{font-size:11px;letter-spacing:.2em;font-weight:700;color:#16191D}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-recibido{color:var(--st-recibido)} .st-diagnostico{color:var(--st-diagnostico)} .st-aprobacion{color:var(--st-aprobacion)} .st-reparacion{color:var(--st-reparacion)} .st-listo{color:var(--st-listo)} .st-entregado{color:var(--st-entregado)} .st-cancelado{color:var(--st-cancelado)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.n{background:var(--surface-2);color:var(--muted)}
.demo-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 4px}

/* Stepper */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:14px 0 4px}
.stepper div{height:6px;border-radius:3px;background:var(--line)}
.stepper div.done{background:var(--ink)} .stepper div.cur{background:var(--accent)}
.stepper-l{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:620px){.stepper-l{display:none}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi .v.money{overflow-wrap:anywhere;font-size:22px;font-family:var(--f-mono);font-weight:600;padding-top:6px}
@media (min-width:981px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}}

/* Tablero por estado */
.board{display:grid;grid-template-columns:repeat(5,minmax(172px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h4{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.otc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.otc:hover{border-color:var(--accent)}
.otc .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.otc .veh{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otc .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.empty-col{font-size:12px;color:var(--muted);padding:8px 2px}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Tablas */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.rech td{opacity:.5} tr.rech td.desc{text-decoration:line-through}
td input.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;min-width:60px}
td input.cell:hover{border-color:var(--line)}
td input.cell:focus{border-color:var(--steel);background:var(--surface);outline:none}
td input.cell.n{text-align:right;font-family:var(--f-mono);min-width:90px}
td.desc{min-width:200px}
td.tipo{white-space:nowrap}
td input.cell.q{min-width:54px;max-width:70px}
.apr{border:0;cursor:pointer}

.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.totals>div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.totals .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.totals .v{font-family:var(--f-mono);font-weight:600;font-size:17px;margin-top:2px}
.totals .big{background:var(--rail);color:var(--rail-ink)} .totals .big .l{color:var(--accent);opacity:1}
@media (max-width:620px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Combustible */
.fuel{display:flex;gap:4px}
.fuel button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 0;font-weight:700;font-size:13px;cursor:pointer;min-width:0}
.fuel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gauge{display:inline-flex;gap:2px;vertical-align:middle}
.gauge i{width:8px;height:12px;border-radius:2px;background:var(--line)}
.gauge i.on{background:var(--ink)}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;background:var(--surface)}
.checks input{width:18px;height:18px;accent-color:var(--ink)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photos .x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-weight:700}
.photo-add{display:grid;place-items:center;background:transparent;font:inherit;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;text-align:center;padding:6px}
.photo-add svg{width:28px;height:28px;display:block;margin:0 auto 4px}
.photo-add:hover{border-color:var(--steel);color:var(--ink)}

.notice{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.notice.info{background:var(--steel-soft);border:1px solid var(--line)}
.notice.ok{background:var(--ok-soft);border:1px solid var(--ok)}

.search{position:relative;flex:1;min-width:200px}
.search input{padding-left:36px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 16px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.tl .d{font-size:12px;color:var(--muted);font-weight:600}
.tl button{all:unset;cursor:pointer;font-weight:700}
.tl button:hover{text-decoration:underline}

.hero-search{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hero-search .txt{flex:1;min-width:220px}
.hero-search .txt p{margin:4px 0 0;color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.imgview{max-width:100%;border-radius:8px;display:block;margin:0 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:821px){.toast{bottom:24px}}

/* Comprobante */
.receipt{background:#fff;color:#111;border:1px solid #ddd;border-radius:8px;padding:22px;font-size:13px}
.receipt h2{font-size:22px;color:#111}
.receipt table td,.receipt table th{border-color:#e3e3e3;color:#111}
.receipt .tot{display:flex;justify-content:flex-end;gap:24px;margin-top:10px;font-family:var(--f-mono);font-weight:600}
.wa-paso{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.wa-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.wa-prev{margin-top:10px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;zoom:.7}
.receipt .rc-head{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#000;color:#fff;margin:-22px -22px 0;padding:14px 22px;border-radius:8px 8px 0 0}
.receipt .rc-logo{width:220px;max-width:50%;height:auto;display:block}
.receipt .rc-doc{text-align:right}
.receipt .rc-tit{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;color:#F5B800}
.receipt .rc-num{font-family:var(--f-mono);font-size:16px;color:#fff}
.receipt .rc-sub{font-size:12px;color:#ccc}
.receipt .rc-taller{font-size:12px;color:#444;padding:8px 0 10px;border-bottom:2px solid #111;margin-bottom:12px}
.receipt .rc-total{font-size:17px}
.receipt .rc-aprob{margin-top:14px;background:#FFF6E0;border:1px solid #F5B800;border-radius:6px;padding:10px 12px;font-size:13px}
.receipt .legal{margin-top:14px;font-size:11px;color:#555;border-top:1px dashed #bbb;padding-top:8px}

.catbar{all:unset;display:flex;flex-direction:column;gap:4px;cursor:pointer;border-radius:8px;padding:6px;margin:-6px}
.catbar:hover,.catbar[aria-pressed="true"]{background:var(--surface-2)}
.catbar:focus-visible{outline:3px solid var(--steel)}
.cb-top{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.cb-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:block}
.catbar[aria-pressed="true"] .cb-track,.catbar:hover .cb-track{background:var(--line)}
.cb-track span{display:block;height:100%;background:var(--accent);border-radius:4px}
.rec-hero{background:#000;border-radius:var(--r);padding:20px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rec-logo{width:min(520px,100%);height:auto;display:block}
.rec-field{display:flex;flex-direction:column;gap:6px;width:min(320px,100%);color:var(--rail-muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rec-field input{width:100%;background:#151515;border:2px solid #3A3A3A;border-radius:10px;padding:10px 12px;font-family:var(--f-plate);font-weight:700;font-size:38px;letter-spacing:.14em;text-align:center;color:#F4F4F4;text-transform:uppercase}
.rec-field input::placeholder{color:#4A4A4A}
.rec-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,154,35,.25)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.tabbar,.no-print{display:none!important} main{padding:0} body{background:#fff}}
</style>

const pad=(n,l=5)=>String(n).padStart(l,'0');

const dayKey=d=>{const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};

// ---------- Datos ----------
const COLS=['clientes','vehiculos','ots','gastos','repuestos','cajas','proveedores'];
const D={clientes:{},vehiculos:{},ots:{},gastos:{},repuestos:{},cajas:{},proveedores:{},config:null};
const cfg=()=>Object.assign({},CONFIG_DEF,D.config||{});

const Store={
  mode:'cargando', db:null, queue:{}, loaded:{},
  LK:'pap_datos_v1', FK:'pap_fotos_v1',
  async init(onChange){
    let db=null;
    try{ if(window.claude && typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){ db=null; }
    if(db){ this.mode='nube'; this.db=db; this._sub(onChange); }
    else { this.mode='local'; this._loadLocal(); this.loaded={config:1}; COLS.forEach(c=>this.loaded[c]=1); onChange(); }
  },
  ready(){ return this.mode==='local' || [...COLS,'config'].every(k=>this.loaded[k]); },
  _sub(onChange){
    for(const col of COLS){
      this.db.collection(col).onSnapshot(snap=>{
        const m={}; snap.docs.forEach(d=>{ m[d.id]=Object.assign({},d.data(),{id:d.id}); });
        D[col]=m; this.loaded[col]=true; onChange();
      }, e=>toast('Sin conexión con la base de datos ('+e.code+'). Recargue la página.'));
    }
    this.db.doc('config/taller').onSnapshot(s=>{ D.config=s.exists?Object.assign({},s.data()):null; this.loaded.config=true; onChange(); },
      e=>toast('Sin conexión con la base de datos ('+e.code+').'));
  },
  _loadLocal(){
    try{ const raw=localStorage.getItem(this.LK); if(raw){ const o=JSON.parse(raw); COLS.forEach(c=>D[c]=o[c]||{}); D.config=o.config||null; } }catch(e){}
  },
  _saveLocal(){
    try{ localStorage.setItem(this.LK,JSON.stringify(Object.assign({config:D.config},Object.fromEntries(COLS.map(c=>[c,D[c]]))))); }
    catch(e){ toast('No se pudo guardar en este dispositivo: el almacenamiento está lleno o bloqueado.'); }
  },
  _q(path,fn){
    const p=(this.queue[path]||Promise.resolve()).catch(()=>{}).then(fn);
    this.queue[path]=p;
    p.catch(e=>{ toast(e&&e.code==='quota_exceeded'?'La base de datos está llena. Exporte una copia y elimine datos de ejemplo.':'No se pudo guardar: '+((e&&(e.message||e.code))||'error')); });
    return p;
  },
  put(col,obj){
    obj=clone(obj); obj.actualizado=nowISO();
    if(col==='config') D.config=obj; else D[col][obj.id]=obj;
    if(this.mode==='nube'){ const path=col==='config'?'config/taller':col+'/'+obj.id; return this._q(path,()=>this.db.doc(path).set(obj)); }
    this._saveLocal(); return Promise.resolve();
  },
  del(col,id){
    delete D[col][id];
    if(this.mode==='nube') return this._q(col+'/'+id,()=>this.db.doc(col+'/'+id).delete());
    this._saveLocal(); return Promise.resolve();
  },
  // Fotos: un documento por foto para no superar el tamaño máximo por registro
  _fotosLocal(){ try{ return JSON.parse(localStorage.getItem(this.FK)||'{}'); }catch(e){ return {}; } },
  async fotosDe(otId){
    if(this.mode==='nube'){ const s=await this.db.collection('fotos').where('otId','==',otId).get(); return s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>a.fecha<b.fecha?-1:1); }
    return Object.values(this._fotosLocal()).filter(f=>f.otId===otId).sort((a,b)=>a.fecha<b.fecha?-1:1);
  },
  async putFoto(f){
    if(this.mode==='nube') return this._q('fotos/'+f.id,()=>this.db.doc('fotos/'+f.id).set(f));
    const all=this._fotosLocal(); all[f.id]=f;
    try{ localStorage.setItem(this.FK,JSON.stringify(all)); }catch(e){ toast('No hay espacio para más fotos en este dispositivo.'); throw e; }
  },
  async delFoto(id){
    if(this.mode==='nube') return this._q('fotos/'+id,()=>this.db.doc('fotos/'+id).delete());
    const all=this._fotosLocal(); delete all[id]; try{ localStorage.setItem(this.FK,JSON.stringify(all)); }catch(e){}
  },
  async todasFotos(){
    if(this.mode==='nube'){ const s=await this.db.collection('fotos').get(); return s.docs.map(d=>Object.assign({},d.data(),{id:d.id})); }
    return Object.values(this._fotosLocal());
  }
};

// ---------- Cálculos ----------
function itemsCobrables(ot){ return (ot.items||[]).filter(i=>i.ok!=='no'); }
function totalOT(ot){ return itemsCobrables(ot).reduce((s,i)=>s+toNum(i.cant)*toNum(i.precio),0); }
function totalCotizado(ot){ return (ot.items||[]).reduce((s,i)=>s+toNum(i.cant)*toNum(i.precio),0); }
function costoOT(ot){ return itemsCobrables(ot).reduce((s,i)=>s+toNum(i.cant)*toNum(i.costo),0); }
function pagadoOT(ot){ return (ot.pagos||[]).reduce((s,p)=>s+toNum(p.valor),0); }
function saldoOT(ot){ return ot.estado==='cancelado'?0:totalOT(ot)-pagadoOT(ot); }
const otsList=()=>Object.values(D.ots).sort((a,b)=>(b.numero||0)-(a.numero||0));
const otsDeVehiculo=vid=>otsList().filter(o=>o.vehiculoId===vid);
const otsDeCliente=cid=>otsList().filter(o=>o.clienteId===cid);
const vehPorPlaca=p=>Object.values(D.vehiculos).find(v=>v.placa===normPlaca(p));
const otAbiertaDe=vid=>otsList().find(o=>o.vehiculoId===vid && ABIERTOS.includes(o.estado));
const nextNumero=()=>Object.values(D.ots).reduce((m,o)=>Math.max(m,o.numero||0),0)+1;
function vehNombre(v){ if(!v) return 'Vehículo'; return [v.marca,v.linea,v.modelo].filter(Boolean).join(' ')||'Vehículo'; }
function vencChip(label,fecha){
  const d=daysUntil(fecha); if(d===null) return `<span class="chip n">${label}: sin dato</span>`;
  if(d<0) return `<span class="chip bad">${label} vencido</span>`;
  if(d<=30) return `<span class="chip warn">${label} vence en ${d} d</span>`;
  return `<span class="chip ok">${label} al día</span>`;
}

  const tb=[['tablero','Tablero','home'],['ordenes','Órdenes','ot'],['recepcion','Recibir','plus'],['vehiculos','Vehículos','car'],['mas','Más','gear']];

function recClienteResultados(q){
  q=(q||'').trim().toLowerCase(); if(q.length<2) return '';

  if(!res.length) return '<p class="small muted">Sin coincidencias.</p>';
  return res.map(c=>`<button type="button" class="li" data-act="rec-elegir-cliente" data-id="${c.id}"><span>${IC.user}</span><span><div class="t">${esc(c.nombre)}</div><div class="s">${esc(c.documento||'')} · ${esc(c.telefono||'')}</div></span><span class="r"><span class="btn sm">Elegir</span></span></button>`).join('');
}

  if(q) l=l.filter(o=>{ const c=D.clientes[o.clienteId]||{}; const v=D.vehiculos[o.vehiculoId]||{}; return [o.placa,otNum(o),c.nombre,c.telefono,vehNombre(v),o.motivo].some(x=>String(x||'').toLowerCase().includes(q)); });
  const fl=[['abiertas','En el taller'],...ESTADOS.map(e=>[e.k,e.n]),['cancelado','Canceladas'],['saldo','Con saldo'],['todas','Todas']];
  return `<div class="page-head"><div><h1>Órdenes de trabajo</h1><p>${l.length} ${l.length===1?'orden':'órdenes'}</p></div><button class="btn primary" data-go="recepcion">${IC.plus} Recibir vehículo</button></div>

}

  return `

    <section class="card">

      <label class="f">Diagnóstico del técnico<textarea class="i" id="ot-diag" data-field="diagnostico" placeholder="Discos delanteros deformados. Se recomienda rectificar o reemplazar." ${cerrada?'disabled':''}>${esc(o.diagnostico||'')}</textarea></label>

      <tbody>${items.map((it,i)=>itemRow(it,i,cerrada)).join('')||`<tr><td colspan="8" class="muted" style="padding:14px 6px">Aún no hay trabajos. Agregue mano de obra y repuestos para armar la cotización.</td></tr>`}</tbody></table></div>

        <div class="row" style="gap:8px"><input class="i" id="ai-scan" placeholder="o escanee el código y pulse Enter" autocomplete="off" style="flex:1;min-width:180px"><button type="button" class="btn" data-act="ot-scan-foto">${IC.cam} Cámara</button></div>`:''}
        <div class="grid3">
          <label class="f">Tipo<select class="i" id="ai-tipo" name="tipo">${Object.entries(TIPOS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label>
          <label class="f" style="grid-column:span 2"><span class="req">Descripción</span><input class="i" id="ai-desc" name="desc" required placeholder="Cambio de pastillas delanteras"></label>

        <div class="grid3">
          <label class="f">Cantidad u horas<input class="i num" id="ai-cant" name="cant" value="1" inputmode="decimal"></label>
          <label class="f"><span class="req">Precio unitario al cliente</span><input class="i num" id="ai-precio" name="precio" inputmode="numeric" required placeholder="${numFmt.format(cf.tarifaHora)}"></label>
          <label class="f"><span>Costo unitario <span class="hint">lo que le cuesta al taller</span></span><input class="i num" id="ai-costo" name="costo" inputmode="numeric" placeholder="0"></label>

        <div class="row"><button class="btn dark" type="submit">${IC.plus} Agregar línea</button><button class="btn" type="button" data-act="add-mo">+ 1 hora de mano de obra (${money(cf.tarifaHora)})</button></div>

    <section class="card">
      <div class="card-head"><h3>Pagos y abonos</h3><span class="mono">${saldoOT(o)>0?`<span class="chip bad">Saldo ${money(saldoOT(o))}</span>`:totalOT(o)>0?'<span class="chip ok">Pagado</span>':''}</span></div>
      ${(o.pagos||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Medio</th><th>Nota</th><th class="n">Valor</th><th></th></tr></thead><tbody>
        ${o.pagos.map((p,i)=>`<tr><td>${fDateTime(p.fecha)}</td><td>${esc(p.medio)}</td><td>${esc(p.nota||'')}</td><td class="n">${money(p.valor)}</td><td>${o.estado!=='cancelado'?`<button class="btn sm ghost" data-act="del-pago" data-i="${i}" aria-label="Eliminar pago">×</button>`:''}</td></tr>`).join('')}

        <label class="f"><span class="req">Valor</span><input class="i num" id="ap-valor" name="valor" inputmode="numeric" required placeholder="${saldoOT(o)>0?numFmt.format(saldoOT(o)):'0'}"></label>
        <label class="f">Medio<select class="i" id="ap-medio" name="medio">${MEDIOS.map(x=>`<option>${x}</option>`).join('')}</select></label>
        <label class="f">Nota<input class="i" id="ap-nota" name="nota" placeholder="Abono, anticipo…"></label>
        <div class="row" style="grid-column:1/-1"><button class="btn dark" type="submit">Registrar pago</button>${saldoOT(o)>0?`<button class="btn" type="button" data-act="pagar-saldo">Pagar saldo completo</button>`:''}</div>
      </form>`:''}
    </section>
    ${facturaCard(o)}
  </div>
  <div class="stack" style="gap:0">
    <section class="card"><h3 style="margin-bottom:10px">Recepción</h3>
      <dl class="kv">
        <dt>Ingreso</dt><dd>${fDateTime(o.fechaIngreso)}</dd>
        <dt>Kilometraje</dt><dd class="mono">${numFmt.format(o.km||0)} km</dd>
        <dt>Combustible</dt><dd>${gauge(o.fuel)} ${esc(FUEL[o.fuel]||'')}</dd>
        <dt>Técnico</dt><dd>${cerrada?esc(o.mecanico||'—'):`<select class="i" id="ot-mec" data-field="mecanico" style="min-height:34px;padding:4px 8px"><option value="">Sin asignar</option>${[...new Set([...cf.mecanicos,o.mecanico].filter(Boolean))].map(m=>`<option ${o.mecanico===m?'selected':''}>${esc(m)}</option>`).join('')}</select>${cf.mecanicos.length?'':'<a href="#" data-go="tecnicos" class="small">Agregar técnicos</a>'}`}</dd>
        <dt>Entrega prometida</dt><dd>${cerrada?fDate(o.fechaPromesa):`<input type="date" class="i" id="ot-prom" data-field="fechaPromesa" value="${esc(o.fechaPromesa||'')}" style="min-height:34px;padding:4px 8px">`}</dd>
        ${o.fechaEntrega?`<dt>Entregado</dt><dd>${fDateTime(o.fechaEntrega)}</dd>`:''}
        <dt>Daños previos</dt><dd>${esc(o.danos||'Ninguno registrado')}</dd>
        <dt>Accesorios</dt><dd>${(o.accesorios||[]).map(esc).join(', ')||'—'}</dd>
        ${o.observaciones?`<dt>Observaciones</dt><dd>${esc(o.observaciones)}</dd>`:''}
        <dt>Datos personales</dt><dd>${o.autorizaDatos?'<span class="chip ok">Autorizó tratamiento</span>':'<span class="chip warn">Sin autorización</span>'}</dd>
      </dl>
      <div class="row" style="margin-top:10px">${vencChip('SOAT',v.soat)} ${vencChip('Tecnomecánica',v.tecno)}</div>
    </section>
    <section class="card"><div class="card-head"><h3>Fotos</h3></div>
      <div class="photos" id="ot-fotos"><p class="small muted">Cargando fotos…</p></div>
    </section>
    <section class="card"><h3 style="margin-bottom:12px">Historial de la orden</h3>
      <div class="timeline">${(o.log||[]).slice().reverse().map(l=>`<div class="tl"><div class="d">${fDateTime(l.fecha)}</div><div>${esc(l.txt)}</div></div>`).join('')}</div>
      <button class="btn sm" data-go="vehiculo" data-id="${v.id}">Ver hoja de vida del vehículo</button>

  </div></div>`;
}
function itemRow(it,i,cerrada){
  const ok=it.ok||'pend'; const lab={pend:['n','Pendiente'],si:['ok','Aprobado'],no:['bad','Rechazado']}[ok];
  const dis=cerrada?'disabled':'';
  return `<tr class="${ok==='no'?'rech':''}">
    <td class="small tipo">${esc(TIPOS[it.tipo]||it.tipo)}${it.repuestoId?` <a href="#" class="chip n" data-go="repuesto" data-id="${it.repuestoId}" title="Del inventario">Inv.</a>`:''}</td>
    <td class="desc"><input class="cell" id="it-d-${i}" data-item="${i}" data-k="desc" value="${esc(it.desc)}" ${dis} aria-label="Descripción"></td>
    <td class="n"><input class="cell n q" id="it-q-${i}" data-item="${i}" data-k="cant" value="${esc(it.cant)}" inputmode="decimal" ${dis} aria-label="Cantidad"></td>
    <td class="n"><input class="cell n" id="it-p-${i}" data-item="${i}" data-k="precio" value="${numFmt.format(toNum(it.precio))}" inputmode="numeric" ${dis} aria-label="Precio"></td>
    <td class="n"><input class="cell n" id="it-c-${i}" data-item="${i}" data-k="costo" value="${toNum(it.costo)?numFmt.format(toNum(it.costo)):''}" inputmode="numeric" ${dis} aria-label="Costo"></td>
    <td class="n" id="it-t-${i}">${money(toNum(it.cant)*toNum(it.precio))}</td>
    <td><button class="chip ${lab[0]} apr" data-act="apr" data-i="${i}" ${dis} title="Cambiar">${lab[1]}</button></td>
    <td>${cerrada?'':`<button class="btn sm ghost" data-act="del-item" data-i="${i}" aria-label="Eliminar línea">×</button>`}</td></tr>`;
}
function totalsHTML(o){
  const t=totalOT(o), co=costoOT(o), cot=totalCotizado(o);
  const pend=(o.items||[]).filter(i=>(i.ok||'pend')==='pend').length;
  return `<div class="totals">
    <div><div class="l">Cotizado</div><div class="v">${money(cot)}</div></div>
    <div><div class="l">Costo estimado</div><div class="v">${money(co)}</div></div>
    <div><div class="l">Utilidad estimada</div><div class="v" style="color:${t-co<0?'var(--bad)':'var(--ok)'}">${money(t-co)}</div></div>
    <div class="big"><div class="l">Total a cobrar</div><div class="v">${money(t)}</div></div>
  </div>${pend&&o.estado==='aprobacion'?`<p class="small muted" style="margin:8px 0 0">${pend} ${pend===1?'línea pendiente':'líneas pendientes'} de aprobación. Las rechazadas no se cobran.</p>`:''}`;
}
async function loadFotos(otId){
  const box=$('#ot-fotos'); if(!box) return;
  let fotos=[]; try{ fotos=await Store.fotosDe(otId); }catch(e){}
  if(ui.view!=='ot'||ui.id!==otId) return;
  const o=D.ots[otId]; const cerrada=o&&(o.estado==='entregado'||o.estado==='cancelado');
  ui.fotosOT=fotos;
  const b=$('#ot-fotos'); if(!b) return;
  b.innerHTML=fotos.map((f,i)=>`<figure><img src="${f.data}" alt="Foto ${i+1} de la orden" data-act="ver-foto-ot" data-i="${i}">${cerrada?'':`<button class="x" data-act="del-foto" data-id="${f.id}" aria-label="Eliminar foto">×</button>`}</figure>`).join('')+
   (cerrada?(fotos.length?'':'<p class="small muted">Sin fotos.</p>'):`<button class="photo-add" data-act="ot-foto">${IC.cam}<span>Agregar fotos</span></button>`);
}

    ${movs.map(m=>`<tr><td>${m.fecha&&m.fecha.length>10?new Date(m.fecha).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):'—'}</td><td>${m.txt}</td><td>${esc(m.medio)}</td><td class="n" style="color:var(--ok)">${m.t==='ing'?money(m.valor):''}</td><td class="n" style="color:var(--bad)">${m.t==='egr'?money(m.valor):''}</td></tr>`).join('')}

function modal(html,wide){ $('#modal-root').innerHTML=`<div class="ov" data-act="close-ov"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`; const f=$('#modal-root .modal button, #modal-root .modal input'); }
function closeModal(){ $('#modal-root').innerHTML=''; if(pendingRender){ pendingRender=false; render(); } }
function confirmar(titulo,texto,okTxt,fn,danger){
  modal(`<div class="mh"><h2>${esc(titulo)}</h2></div><p>${texto}</p><div class="mf"><button class="btn" data-act="close">Volver</button><button class="btn ${danger?'danger':'primary'}" id="cf-ok">${esc(okTxt)}</button></div>`);
  $('#cf-ok').onclick=()=>{ closeModal(); fn(); };

let toastT;
function toast(t){ let el=$('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3200); }
async function copiar(txt){ try{ await navigator.clipboard.writeText(txt); toast('Texto copiado'); }catch(e){ const ta=$('#wa-text'); if(ta){ ta.focus(); ta.select(); toast('Seleccionado: use Copiar del teclado'); } } }

// ---------- Acciones de OT ----------
function addLog(o,txt){ o.log=o.log||[]; o.log.push({fecha:nowISO(),txt}); }
function editOT(id,fn){ const o=clone(D.ots[id]); fn(o); return Store.put('ots',o); }
function cambiarEstado(id,to){
  editOT(id,o=>{ const de=o.estado; o.estado=to; if(to==='entregado') o.fechaEntrega=nowISO(); addLog(o,`${estadoNombre(de)} → ${estadoNombre(to)}`); });
  render(); toast('Estado: '+estadoNombre(to));
}
function msgCotizacion(o){
  const c=D.clientes[o.clienteId]||{}, v=D.vehiculos[o.vehiculoId]||{}, cf=cfg();
  const its=(o.items||[]).filter(i=>i.ok!=='no');
  let t=`Hola ${(c.nombre||'').split(' ')[0]}, le saluda ${cf.nombre}.\n\nCotización ${otNum(o)} para su ${vehNombre(v)} placa ${fmtPlaca(o.placa)}:\n`;
  if(o.diagnostico) t+=`\nDiagnóstico: ${o.diagnostico}\n`;
  t+='\n'; its.forEach((i,n)=>{ t+=`${n+1}. ${i.desc}${toNum(i.cant)!==1?' x'+i.cant:''}: ${money(toNum(i.cant)*toNum(i.precio))}\n`; });
  t+=`\nTOTAL: ${money(its.reduce((s,i)=>s+toNum(i.cant)*toNum(i.precio),0))}`;
  const pag=pagadoOT(o); if(pag) t+=`\nAbonado: ${money(pag)}`;
  t+=`\n\nResponda APROBADO para iniciar la reparación, o díganos qué ítems aprueba (por número).`;
  return t;
}

// Comprobante o cotización como imagen PNG, lista para adjuntar en WhatsApp
const H2C_URL='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
let h2cCarga=null;
function cargarH2C(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  if(!h2cCarga) h2cCarga=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=H2C_URL; s.onload=()=>window.html2canvas?res(window.html2canvas):rej(); s.onerror=()=>{ h2cCarga=null; rej(); }; document.head.appendChild(s); });
  return h2cCarga;
}
async function imagenComprobante(o,modo){
  const h2c=await cargarH2C();
  const box=document.createElement('div'); box.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#fff';
  box.innerHTML=comprobanteHTML(o,modo); document.body.appendChild(box);
  try{ await Promise.all([...box.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{ i.onload=i.onerror=r; })));
    const cv=await h2c(box.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false});
    return await new Promise(r=>cv.toBlob(r,'image/png')); }
  finally{ box.remove(); }
}
async function enviarImagen(o,modo){
  const cot=(modo||(ES_COT(o)?'cot':'ot'))==='cot';
  const nombre=`${cot?'Cotizacion':'Orden'}_${otNum(o)}_${normPlaca(o.placa)}.png`;
  toast('Generando la imagen…');
  let blob; try{ blob=await imagenComprobante(o,modo); }catch(e){ toast('No se pudo generar la imagen. Revise la conexión a internet.'); return false; }
  const enArtifact=!!(window.claude&&window.claude.use);
  if(!enArtifact&&navigator.canShare){ try{ const f=new File([blob],nombre,{type:'image/png'}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:nombre}); return true; } }catch(e){ if(e&&e.name==='AbortError') return false; } }
  await guardarArchivo(nombre,blob,'image/png'); return true;
}
function modalComprobante(o){
  const enArtifact=!!(window.claude&&window.claude.use);
  modal(`<div class="mh"><h2>Comprobante ${otNum(o)}</h2><button class="btn ghost" data-act="close" aria-label="Cerrar">×</button></div>
    <div style="overflow-x:auto">${comprobanteHTML(o)}</div>
    <div class="mf">${enArtifact?'':'<button class="btn" data-act="imprimir">Imprimir</button>'}<button class="btn" data-act="descargar-comp">Descargar (HTML)</button><button class="btn primary" data-act="comp-img">Descargar imagen para WhatsApp</button></div>`,true);
}
async function guardarArchivo(nombre,contenido,mime){
  if(window.claude&&window.claude.use){
    try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:nombre,data:contenido}); return; } }
    catch(e){ if(e&&e.code==='declined') return; toast('No se pudo descargar ('+(e.code||'error')+').'); return; }
  }
  try{ const b=new Blob([contenido],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  catch(e){ toast('Este navegador no permite descargar el archivo.'); }
}

// ---------- Fotos ----------
let fotoDestino=null;
function comprimir(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1024; let w=img.width,h=img.height; if(w>max||h>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.62)); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
$('#photo-input').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  toast('Procesando '+files.length+(files.length===1?' foto…':' fotos…'));
  const datos=[]; for(const f of files){ try{ datos.push(await comprimir(f)); }catch(err){ toast('Una imagen no se pudo leer.'); } }
  if(fotoDestino==='rec'){ ui.rec.fotos=(ui.rec.fotos||[]).concat(datos); render(); }
  else if(fotoDestino){ const otId=fotoDestino; for(const d of datos){ try{ await Store.putFoto({id:uid(),otId,data:d,fecha:nowISO()}); }catch(err){ break; } } editOT(otId,o=>addLog(o,`${datos.length} ${datos.length===1?'foto agregada':'fotos agregadas'}`)); loadFotos(otId); toast('Fotos guardadas'); }
});

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ e.preventDefault(); closeModal(); const k=g.dataset.go; if(['ordenes','vehiculos','clientes'].includes(k)&&ui.view!==k) ui.q=''; go(k,g.dataset.id); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='close-ov'){ if(e.target===a) closeModal(); return; }
  if(act==='close'){ closeModal(); return; }
  const o=ui.view==='ot'?D.ots[ui.id]:null;
  switch(act){
    case 'filtro': ui.filtro=a.dataset.f; ui.q=''; go('ordenes'); break;
    case 'rec-reset': ui.rec=null; render(); break;
    case 'fuel': ui.rec.fuel=+a.dataset.n; a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===a)); break;
    case 'acc': { const s=new Set(ui.rec.acc||[]); a.checked?s.add(a.value):s.delete(a.value); ui.rec.acc=[...s]; break; }
    case 'rec-datos': ui.rec.autorizaDatos=a.checked; break;
    case 'rec-foto': fotoDestino='rec'; $('#photo-input').click(); break;
    case 'rec-quitar-foto': ui.rec.fotos.splice(+a.dataset.i,1); render(); break;
    case 'rec-elegir-cliente': ui.rec.clienteId=a.dataset.id; render(); break;
    case 'rec-cambiar-cliente': ui.rec.clienteId=null; render(); break;
    case 'ver-foto': modal(`<div class="mh"><h2>Foto</h2><button class="btn ghost" data-act="close">×</button></div><img class="imgview" src="${ui.rec.fotos[+a.dataset.src]}" alt="Foto ampliada">`,true); break;
    case 'ver-foto-ot': modal(`<div class="mh"><h2>Foto</h2><button class="btn ghost" data-act="close">×</button></div><img class="imgview" src="${ui.fotosOT[+a.dataset.i].data}" alt="Foto ampliada">`,true); break;
    case 'ot-foto': fotoDestino=ui.id; $('#photo-input').click(); break;
    case 'del-foto': confirmar('Eliminar foto','La foto se borra de la orden.','Eliminar',async()=>{ await Store.delFoto(a.dataset.id); loadFotos(ui.id); },true); break;
    case 'avanzar': cambiarEstado(o.id,a.dataset.to); break;
    case 'reabrir': cambiarEstado(o.id,'recibido'); break;
    case 'entregar': {
      const s=saldoOT(o);
      confirmar('Entregar vehículo', s>0?`Queda un saldo de <b>${money(s)}</b>. Si lo entrega así, la orden pasa a la cartera del cliente.`:'La orden está pagada. Se registra la entrega con la fecha y hora actual.', s>0?'Entregar con saldo pendiente':'Entregar', ()=>cambiarEstado(o.id,'entregado'), s>0);
      break; }
    case 'wa-cotizacion': if(!(o.items||[]).length){ toast('Agregue al menos un trabajo o repuesto antes de cotizar.'); break; } modalWA(o,msgCotizacionCorto(o),'Cotización por WhatsApp'); break;
    case 'wa-listo': modalWA(o,msgListo(o),'Avisar al cliente'); break;
    case 'wa-copiar': copiar($('#wa-text').value); break;
    case 'comprobante': modalComprobante(o); break;
    case 'imprimir': window.print(); break;
    case 'comp-img': { a.disabled=true; enviarImagen(o).then(()=>{ a.disabled=false; }); break; }
    case 'descargar-comp': {
      const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
      const doc=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${otNum(o)} ${fmtPlaca(o.placa)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap"><style>${css} body{background:#fff;padding:20px;max-width:820px;margin:0 auto}</style></head><body>${comprobanteHTML(o)}</body></html>`;
      guardarArchivo(`${otNum(o)}_${normPlaca(o.placa)}.html`,doc,'text/html'); break; }
    case 'apr': { const i=+a.dataset.i; const ord={pend:'si',si:'no',no:'pend'}; editOT(o.id,x=>{ const it=x.items[i]; it.ok=ord[it.ok||'pend']; addLog(x,`${it.desc}: ${({si:'aprobado',no:'rechazado',pend:'pendiente'})[it.ok]} por el cliente`); }); render(); break; }
    case 'del-item': { const i=+a.dataset.i; const it=o.items[i]; confirmar('Eliminar línea',`Se elimina "${esc(it.desc)}" de la orden.`,'Eliminar',()=>{ editOT(o.id,x=>{ x.items.splice(i,1); addLog(x,'Línea eliminada: '+it.desc); }); render(); },true); break; }
    case 'add-mo': editOT(o.id,x=>{ x.items=x.items||[]; x.items.push({id:uid(),tipo:'mo',desc:'Mano de obra',cant:1,precio:cfg().tarifaHora,costo:0,ok:'pend'}); }); render(); break;
    case 'del-pago': { const i=+a.dataset.i; const p=o.pagos[i]; confirmar('Eliminar pago',`Se elimina el pago de <b>${money(p.valor)}</b> (${esc(p.medio)}).`,'Eliminar',()=>{ editOT(o.id,x=>{ x.pagos.splice(i,1); addLog(x,`Pago eliminado: ${money(p.valor)}`); }); render(); },true); break; }
    case 'pagar-saldo': { const f=$('#ap-valor'); f.value=numFmt.format(saldoOT(o)); f.focus(); break; }
    case 'recibir-placa': ui.rec=null; go('recepcion'); ui.rec={}; iniciarRec(a.dataset.placa); render(); break;
    case 'del-tec': { const n=a.dataset.n; const ab=otsList().filter(o=>o.mecanico===n&&ABIERTOS.includes(o.estado)).length;
      confirmar('Quitar técnico',`${esc(n)} deja de aparecer para asignar.${ab?` Tiene <b>${ab}</b> ${ab===1?'orden abierta':'órdenes abiertas'}; esas órdenes conservan su nombre hasta que las reasigne.`:''}`,'Quitar',()=>{ const c=cfg(); c.mecanicos=c.mecanicos.filter(x=>x!==n); Store.put('config',c); render(); toast('Técnico quitado'); },true); break; }
    case 'g-cat': ui.gCat=ui.gCat===a.dataset.c?'':a.dataset.c; render(); break;
    case 'ver-gastos-mes': ui.gMes=a.dataset.m; ui.gCat=''; go('gastos'); break;
    case 'del-gasto': { const g=D.gastos[a.dataset.id]; confirmar('Eliminar gasto',`Se elimina "${esc(g.descripcion)}" por <b>${money(g.valor)}</b>.`,'Eliminar',()=>{ Store.del('gastos',g.id); render(); toast('Gasto eliminado'); },true); break; }
    case 'demo': cargarDemo(); break;
    case 'borrar-demo': confirmar('Eliminar ejemplos','Se borran solo los clientes, vehículos y órdenes marcados como ejemplo. Sus datos reales no se tocan.','Eliminar ejemplos',borrarDemo,true); break;
    case 'exportar': exportar(); break;
    case 'importar': $('#import-input').click(); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.rec && ui.rec){ ui.rec[t.dataset.rec]=t.value; if(t.dataset.rec==='cliQ'){ const box=$('#rec-cli-res'); if(box) box.innerHTML=recClienteResultados(t.value); } }
  if(t.dataset.act==='buscar'){ ui.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById(t.id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  if(t.id==='q-placa'||t.id==='rec-placa'){ const v=t.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v!==t.value) t.value=v; }
});
document.addEventListener('change',e=>{
  const t=e.target; const o=ui.view==='ot'?D.ots[ui.id]:null;
  if(t.dataset.act==='estado-manual'&&o&&t.value){ const to=t.value; t.value=''; if(to==='cancelado') confirmar('Cancelar orden','La orden queda cancelada y no suma a la caja ni a la cartera. Puede reabrirla después.','Cancelar orden',()=>cambiarEstado(o.id,'cancelado'),true); else cambiarEstado(o.id,to); return; }
  if(t.dataset.act==='g-mes'){ ui.gMes=t.value||todayKey().slice(0,7); ui.gCat=''; render(); return; }
  if(t.dataset.act==='caja-dia'){ ui.cajaDia=t.value||todayKey(); render(); return; }
  if(t.dataset.field&&o){ const k=t.dataset.field; const v=t.value; editOT(o.id,x=>{ if(x[k]!==v){ x[k]=v; if(k==='mecanico') addLog(x,'Técnico asignado: '+(v||'sin asignar')); if(k==='fechaPromesa') addLog(x,'Nueva fecha prometida: '+fDate(v)); } }); toast('Guardado'); return; }
  if(t.dataset.item!==undefined&&o){
    const i=+t.dataset.item, k=t.dataset.k; let v=t.value;
    if(k==='precio'||k==='costo'){ v=toNum(v); t.value=v?numFmt.format(v):''; } else if(k==='cant'){ v=toNum(v)||1; t.value=v; }
    editOT(o.id,x=>{ x.items[i][k]=v; });
    const it=D.ots[o.id].items[i]; const td=$('#it-t-'+i); if(td) td.textContent=money(toNum(it.cant)*toNum(it.precio));
    $('#ot-totals').innerHTML=totalsHTML(D.ots[o.id]); return;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target; const k=f.dataset.form; if(!k) return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());

  if(k==='add-tec'){ const n=(fd.nombre||'').trim().replace(/\s+/g,' '); if(!n) return; const c=cfg(); if(c.mecanicos.some(x=>x.toLowerCase()===n.toLowerCase())){ toast('Ese técnico ya está en la lista.'); return; } c.mecanicos=[...c.mecanicos,n]; Store.put('config',c); render(); toast(n+' agregado'); setTimeout(()=>{ const i=$('#tec-nombre'); i&&i.focus(); },30); return; }
  if(k==='add-gasto'){ const val=toNum(fd.valor); if(!(val>0)){ toast('Escriba un valor mayor a cero.'); return; } if(!(fd.descripcion||'').trim()){ toast('Escriba la descripción del gasto.'); return; }

function iniciarRec(placa){
  const v=vehPorPlaca(placa);
  ui.rec=Object.assign(ui.rec||{},{paso:2,placa:normPlaca(placa),vehiculoId:v?v.id:null,clienteId:v?v.clienteId:null,fuel:ui.rec&&ui.rec.fuel!=null?ui.rec.fuel:2,fotos:(ui.rec&&ui.rec.fotos)||[],acc:(ui.rec&&ui.rec.acc)||[],autorizaDatos:(ui.rec&&ui.rec.autorizaDatos)||false,anticipoMedio:'Efectivo'});
}
async function crearOT(){
  const r=ui.rec; const c=cfg();
  const km=toNum(r.km); if(!km&&km!==0||!r.km){ toast('Escriba el kilometraje.'); $('#ri-km')&&$('#ri-km').focus(); return; }
  let cliente=r.clienteId?clone(D.clientes[r.clienteId]):null;
  if(!cliente){
    if(!(r.cli_nombre||'').trim()||!(r.cli_telefono||'').trim()){ toast('Escriba el nombre y el celular del propietario.'); return; }
    cliente={id:uid(),tipoDoc:r.cli_tipoDoc||'CC',nombre:r.cli_nombre.trim(),documento:(r.cli_documento||'').trim(),telefono:r.cli_telefono.trim(),correo:(r.cli_correo||'').trim(),direccion:'',notas:'',creado:nowISO()};
  }
  if(r.autorizaDatos){ cliente.autorizaDatos=true; cliente.fechaAutorizacion=nowISO(); }
  let v=r.vehiculoId?clone(D.vehiculos[r.vehiculoId]):{id:uid(),placa:r.placa,creado:nowISO()};
  for(const k of ['marca','linea','modelo','color','combustible','vin','soat','tecno']) if(r[k]!==undefined) v[k]=String(r[k]).trim();
  if(!v.combustible) v.combustible='Gasolina';
  if(!v.marca){ toast('Escriba la marca del vehículo.'); return; }
  if(v.km && km<v.km && !r.kmOk){ r.kmOk=true; toast(`El kilometraje es menor que el último registrado (${numFmt.format(v.km)}). Revíselo y pulse de nuevo para confirmar.`); return; }
  if(!(r.motivo||'').trim()){ toast('Escriba el motivo de ingreso.'); $('#ri-motivo')&&$('#ri-motivo').focus(); return; }
  v.km=Math.max(km,v.km||0); v.clienteId=cliente.id;
  const ot={id:uid(),numero:nextNumero(),placa:v.placa,vehiculoId:v.id,clienteId:cliente.id,estado:'recibido',fechaIngreso:nowISO(),fechaPromesa:r.fechaPromesa||'',km,fuel:r.fuel??2,motivo:r.motivo.trim(),danos:(r.danos||'').trim(),accesorios:r.acc||[],observaciones:(r.observaciones||'').trim(),mecanico:r.mecanico||'',autorizaDatos:!!r.autorizaDatos,diagnostico:'',items:[],pagos:[],log:[]};
  addLog(ot,'Vehículo recibido'+(ot.mecanico?' · técnico: '+ot.mecanico:''));
  const ant=toNum(r.anticipo); if(ant>0){ ot.pagos.push({id:uid(),fecha:nowISO(),valor:ant,medio:r.anticipoMedio||'Efectivo',nota:'Anticipo'}); addLog(ot,`Anticipo: ${money(ant)}`); }
  Store.put('clientes',cliente); Store.put('vehiculos',v); Store.put('ots',ot);
  const fotos=r.fotos||[];
  ui.rec=null; go('ot',ot.id); toast(`${otNum(ot)} creada`);
  for(const d of fotos){ try{ await Store.putFoto({id:uid(),otId:ot.id,data:d,fecha:nowISO()}); }catch(e){ break; } }
  if(fotos.length) loadFotos(ot.id);
}

$('#import-input').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let data; try{ data=JSON.parse(await f.text()); }catch(err){ toast('El archivo no es una copia válida.'); return; }
  if(data.app!=='placa-a-placa'){ toast('El archivo no es una copia de Placa a Placa.'); return; }
  confirmar('Restaurar copia',`Se agregan o actualizan ${data.clientes.length} clientes, ${data.vehiculos.length} vehículos, ${data.ots.length} órdenes y ${(data.gastos||[]).length} gastos. Los registros que ya existen con el mismo identificador se reemplazan.`,'Restaurar',async()=>{
    if(data.config) Store.put('config',data.config);
    for(const c of data.clientes) Store.put('clientes',c);
    for(const v of data.vehiculos) Store.put('vehiculos',v);
    for(const o of data.ots) Store.put('ots',o);
    for(const col of ['gastos','repuestos','cajas','proveedores']) for(const x of (data[col]||[])) Store.put(col,x);
    for(const ph of (data.fotos||[])){ try{ await Store.putFoto(ph); }catch(err){ break; } }
    render(); toast('Copia restaurada');
  });
});

// ---------- Inventario: la existencia se calcula, nunca se guarda ----------
// Entradas (compras, ajustes, inventario inicial) viven en el repuesto.
// Salidas = líneas de órdenes no canceladas, ligadas al repuesto y no rechazadas.
function consumoRep(rid){
  let usado=0, reservado=0;
  for(const o of Object.values(D.ots)){
    if(o.estado==='cancelado') continue;
    for(const it of (o.items||[])) if(it.repuestoId===rid && it.ok!=='no'){
      if(o.estado==='entregado') usado+=toNum(it.cant); else reservado+=toNum(it.cant);
    }
  }
  return {usado,reservado};
}
function stockRep(r){
  const ent=(r.entradas||[]).reduce((s,e)=>s+toNum(e.cant),0);
  const {usado,reservado}=consumoRep(r.id);
  return {existencia:ent-usado, reservado, disponible:ent-usado-reservado};
}
const repList=()=>Object.values(D.repuestos).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
const bajoMinimo=()=>repList().filter(r=>toNum(r.minimo)>0 && stockRep(r).disponible<=toNum(r.minimo));
function repNombre(r){ return [r.nombre,r.marca].filter(Boolean).join(' · '); }

  const q=ui.q.trim().toLowerCase();
  const todos=repList();

  const valor=todos.reduce((s,r)=>s+Math.max(0,stockRep(r).existencia)*toNum(r.costo),0);
  const bajos=bajoMinimo().length;
  return `<div class="page-head"><div><h1>Inventario de repuestos</h1><p>${todos.length} referencias · valor en bodega ${money(valor)}</p></div>

      <div class="filters"><button data-act="inv-filtro" data-f="" aria-pressed="${!ui.invFiltro}">Todos</button><button data-act="inv-filtro" data-f="bajo" aria-pressed="${ui.invFiltro==='bajo'}">Bajo mínimo</button></div></div>
    ${l.length?`<div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Repuesto</th><th>Ubicación</th><th class="n">Existencia</th><th class="n">Reservado</th><th class="n">Disponible</th><th class="n">Costo</th><th class="n">Precio</th></tr></thead><tbody>

// ---------- Caja diaria: apertura y cierre ----------
function efectivoDelDia(dia){
  let ing=0, egr=0;
  otsList().forEach(o=>(o.pagos||[]).forEach(p=>{ if(dayKey(p.fecha)===dia&&p.medio==='Efectivo') ing+=toNum(p.valor); }));
  gastosList().forEach(g=>{ if(g.fecha===dia&&g.medio==='Efectivo') egr+=toNum(g.valor); });
  return {ing,egr};
}
function cajaHTML(dia){
  const c=D.cajas[dia]; const ef=efectivoDelDia(dia);
  if(!c) return `<section class="card caja-box"><div class="card-head"><h3>Apertura de caja</h3><span class="chip warn">Sin abrir</span></div>

  if(!c.cierre) return `<section class="card caja-box"><div class="card-head"><h3>Caja abierta</h3><span class="chip ok">Abierta ${c.apertura?new Date(c.apertura).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):''}</span></div>
    <dl class="kv"><dt>Base</dt><dd class="mono" style="text-align:right">${money(c.base)}</dd><dt>+ Efectivo recibido</dt><dd class="mono" style="text-align:right">${money(ef.ing)}</dd><dt>− Gastos en efectivo</dt><dd class="mono" style="text-align:right">${money(ef.egr)}</dd><dt><b>Debe haber</b></dt><dd class="mono" style="text-align:right"><b>${money(esperado)}</b></dd></dl>
    <form data-form="caja-cerrar" data-dia="${dia}" class="stack" style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)">
      <div class="grid2"><label class="f"><span class="req">Efectivo contado al cerrar</span><input class="i num" id="cj-contado" name="contado" inputmode="numeric" required></label>
      <label class="f">Nota<input class="i" id="cj-nota" name="nota" placeholder="Quién cuenta, consignación…"></label></div>
      <button class="btn dark" type="submit">Cerrar caja</button></form></section>`;

function diasDesde(f){ if(!f) return 0; return Math.max(0,Math.round((new Date(todayKey()+'T12:00:00')-new Date(dayKey(f)+'T12:00:00'))/864e5)); }
function moraChip(d){ return d<=15?`<span class="chip ok">${d} días</span>`:d<=30?`<span class="chip warn">${d} días</span>`:`<span class="chip bad">${d} días</span>`; }

// ---------- Comisiones ----------
function periodoRango(k){
  const h=new Date(); const y=h.getFullYear(), m=h.getMonth(), d=h.getDate();
  const f=(Y,M,D)=>dayKey(new Date(Y,M,D,12));
  const fin=(Y,M)=>new Date(Y,M+1,0).getDate();
  const nm=(Y,M)=>new Date(Y,M,15).toLocaleDateString('es-CO',{month:'long'});
  if(k==='q-act') return d<=15?{desde:f(y,m,1),hasta:f(y,m,15),n:`1ª quincena de ${nm(y,m)}`}:{desde:f(y,m,16),hasta:f(y,m,fin(y,m)),n:`2ª quincena de ${nm(y,m)}`};
  if(k==='q-ant'){ if(d>15) return {desde:f(y,m,1),hasta:f(y,m,15),n:`1ª quincena de ${nm(y,m)}`}; const pm=m===0?11:m-1, py=m===0?y-1:y; return {desde:f(py,pm,16),hasta:f(py,pm,fin(py,pm)),n:`2ª quincena de ${nm(py,pm)}`}; }
  if(k==='m-ant'){ const pm=m===0?11:m-1, py=m===0?y-1:y; return {desde:f(py,pm,1),hasta:f(py,pm,fin(py,pm)),n:`${nm(py,pm)} ${py}`}; }
  return {desde:f(y,m,1),hasta:f(y,m,fin(y,m)),n:`${nm(y,m)} ${y}`};
}
function liquidacion(nombre,r){
  const ots=otsList().filter(o=>o.estado==='entregado'&&o.mecanico===nombre&&o.fechaEntrega&&dayKey(o.fechaEntrega)>=r.desde&&dayKey(o.fechaEntrega)<=r.hasta);
  const det=ots.map(o=>({o,mo:itemsCobrables(o).filter(i=>i.tipo==='mo').reduce((s,i)=>s+toNum(i.cant)*toNum(i.precio),0)}));
  const mo=det.reduce((s,x)=>s+x.mo,0); const pct=toNum((cfg().comisiones||{})[nombre]);
  const key=`${nombre}|${r.desde}|${r.hasta}`;
  const pago=Object.values(D.gastos).find(g=>g.liqKey===key);
  return {det,mo,pct,comision:Math.round(mo*pct/100),key,pago};
}

// ---------- Facturación ----------
const TIPO_DOC=['CC','NIT','CE','PP','TI'];
function ivaDe(valor){ const c=cfg(); const p=toNum(c.ivaPct)/100; if(!p) return {base:valor,iva:0}; if(c.preciosConIva){ const base=valor/(1+p); return {base,iva:valor-base}; } return {base:valor,iva:valor*p}; }
function totalesFactura(o){ const t=totalOT(o); const {base,iva}=ivaDe(t); return {base,iva,total:cfg().preciosConIva?t:t+iva}; }
function porFacturar(){ return otsList().filter(o=>o.estado==='entregado'&&totalOT(o)>0&&!(o.factura&&o.factura.numero)); }
function datosFactura(o){
  const c=D.clientes[o.clienteId]||{}, v=D.vehiculos[o.vehiculoId]||{}, cf=cfg(); const tf=totalesFactura(o);
  let t=`CLIENTE\n${c.tipoDoc||'CC'} ${c.documento||'(sin documento)'}\n${c.nombre||''}\nCorreo: ${c.correo||'(sin correo)'}\nCelular: ${c.telefono||''}\nDirección: ${c.direccion||''}\n\n`;
  t+=`REFERENCIA: ${otNum(o)} · ${vehNombre(v)} placa ${fmtPlaca(o.placa)} · ${numFmt.format(o.km||0)} km\n\nÍTEMS (valores ${cf.preciosConIva?'con':'sin'} IVA ${cf.ivaPct}%)\n`;
  itemsCobrables(o).forEach((i,n)=>{ t+=`${n+1}. ${i.desc} | ${TIPOS[i.tipo]||''} | cant ${i.cant} | ${money(i.precio)} | ${money(toNum(i.cant)*toNum(i.precio))}\n`; });
  t+=`\nSubtotal: ${money(tf.base)}\nIVA ${cf.ivaPct}%: ${money(tf.iva)}\nTOTAL: ${money(tf.total)}\nPagado: ${money(pagadoOT(o))}${saldoOT(o)>0?`\nForma de pago: CRÉDITO (saldo ${money(saldoOT(o))})`:'\nForma de pago: CONTADO'}`;
  return t;
}

function csvPendientes(){
  const cf=cfg(); const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['fecha_entrega','orden','placa','tipo_documento','documento','cliente','correo','celular','direccion','item','tipo','cantidad','valor_unitario_sin_iva','iva_pct','valor_iva','total_linea','forma_pago']];
  porFacturar().forEach(o=>{ const c=D.clientes[o.clienteId]||{}; const credito=saldoOT(o)>0?'Crédito':'Contado';
    itemsCobrables(o).forEach(i=>{ const tl=toNum(i.cant)*toNum(i.precio); const {base,iva}=ivaDe(tl); const unit=toNum(i.cant)?base/toNum(i.cant):base;
      rows.push([dayKey(o.fechaEntrega),otNum(o),normPlaca(o.placa),c.tipoDoc||'CC',c.documento||'',c.nombre||'',c.correo||'',c.telefono||'',c.direccion||'',i.desc,TIPOS[i.tipo]||'',i.cant,Math.round(unit),cf.ivaPct,Math.round(iva),Math.round(base+iva),credito]); }); });
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

// ---------- Eventos de la fase 2 ----------
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a||e.target.closest('[data-go]')) return;
  const act=a.dataset.act; const o=ui.view==='ot'?D.ots[ui.id]:null;
  switch(act){
    case 'rep-nuevo': modalRepNuevo(); break;
    case 'rep-compra': modalRepCompra(D.repuestos[a.dataset.id]); break;
    case 'rep-ajuste': modalRepAjuste(D.repuestos[a.dataset.id]); break;

// ---------- Importar inventario desde Excel o CSV ----------
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxCarga=null;
function cargarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxCarga) xlsxCarga=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=XLSX_URL; s.onload=()=>window.XLSX?res(window.XLSX):rej(); s.onerror=()=>{ xlsxCarga=null; rej(); }; document.head.appendChild(s); });
  return xlsxCarga;
}
const IMP_CAMPOS=[
  ['codigo','Código o referencia',['codigo','cod','referencia','ref','sku','oem','codigointerno','item','parte','numerodeparte','plu']],
  ['barras','Código de barras',['codigodebarras','barras','ean','ean13','upc','codbarras','codigobarras','qr']],
  ['nombre','Nombre del repuesto',['nombre','descripcion','producto','articulo','repuesto','detalle','nombredelproducto','nombredelrepuesto']],
  ['marca','Marca',['marca','fabricante','brand']],
  ['ubicacion','Ubicación',['ubicacion','bodega','estante','posicion','lugar','ubic']],
  ['cantidad','Cantidad en bodega',['cantidad','cant','existencia','existencias','stock','inventario','saldo','unidades','und','disponible']],
  ['costo','Costo unitario',['costo','costounitario','preciodecompra','compra','preciocompra','valorcompra','costoprom','costopromedio','valorunitario']],
  ['precio','Precio de venta',['precio','preciodeventa','venta','pventa','precioventa','pvp','valorventa','preciopublico']],
  ['minimo','Existencia mínima',['minimo','stockminimo','min','existenciaminima','cantidadminima','puntodepedido']],
  ['proveedor','Proveedor',['proveedor','distribuidor','vendedor','supplier']]];
const normH=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
let imp=null;

async function leerArchivoInventario(file){
  toast('Leyendo '+file.name+'…');
  let X; try{ X=await cargarXLSX(); }catch(e){ toast('No se pudo cargar el lector de Excel. Revise la conexión a internet e intente de nuevo.'); return; }
  let rows;
  try{
    const wb=X.read(await file.arrayBuffer(),{type:'array'});
    const hoja=wb.Sheets[wb.SheetNames[0]];
    rows=X.utils.sheet_to_json(hoja,{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  }catch(e){ toast('El archivo no se pudo leer. Guárdelo como .xlsx o .csv e intente de nuevo.'); return; }
  if(rows.length<2){ toast('El archivo no tiene filas para importar.'); return; }
  // Fila de encabezados: la primera de las 10 iniciales que reconozca al menos 2 columnas
  let hi=0, best=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){ const n=rows[i].filter(c=>IMP_CAMPOS.some(f=>f[2].includes(normH(c)))).length; if(n>best){ best=n; hi=i; } if(n>=3) break; }
  const headers=rows[hi].map((h,i)=>String(h).trim()||`Columna ${i+1}`);
  const map={}; IMP_CAMPOS.forEach(([k,,syn])=>{ const i=headers.findIndex(h=>syn.includes(normH(h))); map[k]=i; });
  if(map.nombre<0){ const i=headers.findIndex((h,j)=>!Object.values(map).includes(j)&&rows.slice(hi+1,hi+6).some(r=>isNaN(toNum(r[j]))||/[a-z]/i.test(String(r[j])))); map.nombre=i; }
  imp={archivo:file.name,headers,datos:rows.slice(hi+1),map,actualizar:true,cantModo:'reemplazar'};
  modalImportar();
}
function impFilas(){
  const {datos,map}=imp; const g=(r,k)=>map[k]>=0?r[map[k]]:'';
  return datos.map(r=>({barras:String(g(r,'barras')).trim(),codigo:String(g(r,'codigo')).trim(),nombre:String(g(r,'nombre')).trim(),marca:String(g(r,'marca')).trim(),ubicacion:String(g(r,'ubicacion')).trim(),
    cantidad:map.cantidad>=0&&String(g(r,'cantidad')).trim()!==''?toNum(g(r,'cantidad')):null,costo:toNum(g(r,'costo')),precio:toNum(g(r,'precio')),minimo:toNum(g(r,'minimo')),proveedor:String(g(r,'proveedor')).trim()}));
}
function impBuscarExistente(f){
  const l=Object.values(D.repuestos);
  if(f.barras){ const b=normH(f.barras); const r=l.find(x=>x.barras&&normH(x.barras)===b); if(r) return r; }
  if(f.codigo){ const c=normH(f.codigo); const r=l.find(x=>x.codigo&&normH(x.codigo)===c); if(r) return r; }
  const n=normH(f.nombre+(f.marca||'')); return l.find(x=>normH((x.nombre||'')+(x.marca||''))===n&&(!f.codigo||!x.codigo));
}
function impResumen(){
  let nuevos=0, act=0, omit=0;
  impFilas().forEach(f=>{ if(!f.nombre&&!f.codigo){ omit++; return; } if(impBuscarExistente(f)){ if(imp.actualizar) act++; else omit++; } else if(f.nombre) nuevos++; else omit++; });
  return {nuevos,act,omit};
}
function modalImportar(){
  const {headers,map}=imp; const filas=impFilas(); const rs=impResumen();
  const prev=filas.slice(0,6);
  const sel=(k)=>`<select class="i" data-act="imp-map" data-k="${k}" id="imp-${k}"><option value="-1">— No importar —</option>${headers.map((h,i)=>`<option value="${i}" ${map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select>`;
  modal(`<div class="mh"><h2>Importar inventario</h2><button class="btn ghost" data-act="imp-cerrar" aria-label="Cerrar">×</button></div>
    <p style="margin-top:0"><b>${esc(imp.archivo)}</b> · ${filas.length} filas. Revise qué columna del archivo corresponde a cada dato.</p>
    <div class="grid2" style="gap:10px">${IMP_CAMPOS.map(([k,n])=>`<label class="f"><span>${n}${k==='nombre'?' <span style="color:var(--bad)">*</span>':''}</span>${sel(k)}</label>`).join('')}</div>
    <h3 style="margin:16px 0 8px">Vista previa</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Nombre</th><th>Marca</th><th class="n">Cant.</th><th class="n">Costo</th><th class="n">Precio</th><th>Acción</th></tr></thead><tbody>
    ${prev.map(f=>{ const ex=impBuscarExistente(f); return `<tr><td class="mono small">${esc(f.codigo)}</td><td>${esc(f.nombre)||'<span class="chip bad">Sin nombre</span>'}</td><td class="small">${esc(f.marca)}</td><td class="n">${f.cantidad==null?'—':numFmt.format(f.cantidad)}</td><td class="n">${f.costo?money(f.costo):''}</td><td class="n">${f.precio?money(f.precio):''}</td><td>${!f.nombre&&!ex?'<span class="chip n">Se omite</span>':ex?(imp.actualizar?'<span class="chip warn">Actualiza</span>':'<span class="chip n">Se omite</span>'):'<span class="chip ok">Nuevo</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>
    ${filas.length>6?`<p class="small muted">… y ${filas.length-6} filas más.</p>`:''}
    <div class="stack" style="gap:8px;margin-top:12px">
      <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="imp-act" data-act="imp-act" ${imp.actualizar?'checked':''} style="width:20px;height:20px;accent-color:var(--ink)"> Si el repuesto ya existe (mismo código), actualizar sus datos</label>
      ${map.cantidad>=0?`<div class="f"><span>La cantidad del archivo, para repuestos que ya existen:</span>
        <div class="filters"><button data-act="imp-cant" data-v="reemplazar" aria-pressed="${imp.cantModo==='reemplazar'}">Es la existencia actual (ajustar)</button><button data-act="imp-cant" data-v="sumar" aria-pressed="${imp.cantModo==='sumar'}">Es una compra (sumar)</button></div></div>`:''}
    </div>
    <div class="notice ${rs.nuevos+rs.act?'info':'warn'}" style="margin-top:14px"><div><b>${rs.nuevos}</b> nuevos · <b>${rs.act}</b> se actualizan · <b>${rs.omit}</b> se omiten${map.nombre<0?'. Elija la columna del nombre para continuar.':''}</div></div>
    <div id="imp-prog" class="small muted" style="margin-top:8px"></div>
    <div class="mf"><button class="btn" data-act="imp-cerrar">Cancelar</button><button class="btn primary" data-act="imp-ok" ${rs.nuevos+rs.act&&map.nombre>=0?'':'disabled'}>Importar ${rs.nuevos+rs.act} repuestos</button></div>`,true);
}
async function ejecutarImportacion(){
  const filas=impFilas(); const btn=$('[data-act="imp-ok"]'); if(btn) btn.disabled=true;
  const prog=$('#imp-prog'); let n=0, nuevos=0, act=0; const total=impResumen(); const meta=total.nuevos+total.act;
  const vistos={};
  for(const f of filas){
    if(!f.nombre&&!f.codigo) continue;
    const key=normH(f.codigo)||normH(f.nombre+f.marca);
    let ex=impBuscarExistente(f); if(!ex&&vistos[key]) ex=D.repuestos[vistos[key]];
    if(ex&&!imp.actualizar) continue;
    if(!ex&&!f.nombre) continue;
    let r;
    if(ex){
      r=clone(ex);
      for(const k of ['barras','codigo','nombre','marca','ubicacion','proveedor']) if(f[k]) r[k]=f[k];
      for(const k of ['costo','precio','minimo']) if(f[k]) r[k]=f[k];
      if(f.cantidad!=null){ r.entradas=r.entradas||[];
        if(imp.cantModo==='sumar'){ if(f.cantidad) r.entradas.push({id:uid(),fecha:nowISO(),tipo:'compra',cant:f.cantidad,costo:r.costo,nota:'Importado de '+imp.archivo}); }
        else { const dif=f.cantidad-stockRep(ex).existencia; if(dif) r.entradas.push({id:uid(),fecha:nowISO(),tipo:'ajuste',cant:dif,nota:'Importado de '+imp.archivo}); } }
      act++;
    } else {
      r={id:uid(),barras:f.barras,codigo:f.codigo,nombre:f.nombre,marca:f.marca,ubicacion:f.ubicacion,costo:f.costo,precio:f.precio,minimo:f.minimo,proveedor:f.proveedor,entradas:[],creado:nowISO()};
      if(f.cantidad) r.entradas.push({id:uid(),fecha:nowISO(),tipo:'inicial',cant:f.cantidad,costo:f.costo,nota:'Importado de '+imp.archivo});
      nuevos++;
    }
    vistos[key]=r.id;
    try{ await Store.put('repuestos',r); }catch(e){ if(prog) prog.textContent='Se detuvo por un error al guardar. Lo importado hasta aquí quedó guardado.'; break; }
    n++; if(prog&&(n%10===0||n===meta)) prog.textContent=`Guardando ${n} de ${meta}…`;
  }
  imp=null; closeModal(); ui.invFiltro=''; ui.q=''; go('inventario');
  toast(`Importación lista: ${nuevos} nuevos y ${act} actualizados`);
}
function plantillaInventario(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['Código','Código de barras','Nombre','Marca','Ubicación','Cantidad','Costo','Precio','Mínimo','Proveedor'],
    ['PF-SPK-01','7701234567897','Pastillas delanteras Spark','Bosch','A1',3,115000,180000,2,'Repuestos El Prado'],
    ['FA-2201','','Filtro de aceite','Mann','B3',6,22000,38000,5,'Lubricantes del Caribe']];
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  switch(a.dataset.act){
    case 'imp-abrir': $('#inv-input').click(); break;
    case 'imp-plantilla': guardarArchivo('plantilla-inventario.csv',plantillaInventario(),'text/csv'); break;

});
document.addEventListener('change',e=>{
