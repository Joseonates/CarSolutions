// ---------- Códigos de barras y QR ----------
// Pistola lectora (USB o Bluetooth): escribe el código y pulsa Enter, así que basta un campo de texto.
// Cámara: se toma una foto del código y se lee en el navegador (BarcodeDetector o ZXing).
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let zxingCarga=null;
function cargarZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(!zxingCarga) zxingCarga=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=ZXING_URL; s.onload=()=>window.ZXing?res(window.ZXing):rej(); s.onerror=()=>{ zxingCarga=null; rej(); }; document.head.appendChild(s); });
  return zxingCarga;
}
const normCod=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function repPorCodigo(code){
  const c=normCod(code); if(!c) return null;
  return Object.values(D.repuestos).find(r=>normCod(r.barras)===c)||Object.values(D.repuestos).find(r=>normCod(r.codigo)===c)||null;
}
async function leerCodigoDeFoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    // Reducir fotos grandes del celular para leer más rápido
    const k=Math.min(1,1600/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    if('BarcodeDetector' in window){ try{ const r=await new BarcodeDetector().detect(cv); if(r&&r.length) return r[0].rawValue; }catch(e){} }
    const Z=await cargarZXing();
    const hints=new Map(); hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const small=new Image(); await new Promise((res,rej)=>{ small.onload=res; small.onerror=rej; small.src=cv.toDataURL('image/jpeg',0.92); });
    const reader=new Z.BrowserMultiFormatReader(hints);
    const r=await reader.decodeFromImageElement(small); return r&&r.getText();
  }catch(e){ return null; }
  finally{ URL.revokeObjectURL(url); }
}
let escanerCb=null;
function escanearFoto(cb){ escanerCb=cb; $('#scan-input').click(); }
async function procesarFotoCodigo(file){
  toast('Leyendo el código…');
  const code=await leerCodigoDeFoto(file);
  if(!code){ toast('No se encontró un código en la foto. Acérquese, enfoque bien o escríbalo.'); return; }

  if(cb) cb(code); else toast('Código leído: '+code);
}

function registrarEntrada(){
  const e=ui.ent; const fecha=e.fecha||todayKey(); let tot=0;
  if(e.medio==='Crédito con el proveedor'&&!String(e.proveedor||'').trim()){ toast('Para una entrada a crédito escriba el proveedor.'); const i=$('#ent-prov'); i&&i.focus(); return; }
  for(const x of e.items){ const r=clone(D.repuestos[x.rid]); const cant=toNum(x.cant), costo=toNum(x.costo)||toNum(r.costo); if(!(cant>0)) continue;
    r.entradas=r.entradas||[]; r.entradas.push({id:uid(),fecha:fecha+'T12:00:00',tipo:'compra',cant,costo,proveedor:e.proveedor,nota:e.factura?'Factura '+e.factura:''});
    if(costo) r.costo=costo; if(e.proveedor) r.proveedor=e.proveedor; Store.put('repuestos',r); tot+=cant*costo; }
  if(e.gasto&&e.medio!=='Crédito con el proveedor'&&tot>0) Store.put('gastos',{id:uid(),fecha,valor:Math.round(tot),categoria:'Repuestos y compras',medio:e.medio,descripcion:`Entrada de mercancía (${e.items.length} referencias)${e.factura?' · factura '+e.factura:''}`,proveedor:e.proveedor,otId:'',creado:nowISO()});
  if(e.medio==='Crédito con el proveedor'&&tot>0) registrarCredito(e.proveedor,tot,e.factura,`Entrada de mercancía (${e.items.length} referencias)`,fecha);
  const n=e.items.length; ui.ent=null; go('inventario'); toast(e.medio==='Crédito con el proveedor'?`Entrada registrada. Queda por pagar ${money(tot)} a ${e.proveedor}`:`Entrada registrada: ${n} referencias por ${money(tot)}`);
}

document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]'); if(!a) return;

    case 'ent-abrir': ui.ent=ui.ent||nuevaEntrada(); go('entrada'); setTimeout(()=>{ const i=$('#ent-code'); i&&i.focus(); },30); break;

// ---------- Proveedores y cuentas por pagar ----------
const provList=()=>Object.values(D.proveedores).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
function provPorNombre(n){ const k=normH(n); return k?Object.values(D.proveedores).find(p=>normH(p.nombre)===k)||null:null; }
function provSaldo(p){ return (p.cuentas||[]).reduce((s,c)=>s+toNum(c.valor),0)-(p.pagos||[]).reduce((s,x)=>s+toNum(x.valor),0); }
function provVencido(p){
  // Las facturas a crédito se pagan en orden: lo abonado cubre primero las más antiguas
  let abonado=(p.pagos||[]).reduce((s,x)=>s+toNum(x.valor),0), venc=0;
  [...(p.cuentas||[])].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(c=>{ const v=toNum(c.valor); const cubre=Math.min(v,abonado); abonado-=cubre; if(v-cubre>0&&c.vence&&daysUntil(c.vence)<0) venc+=v-cubre; });
  return venc;
}
function provCompras(p,desde){
  const k=normH(p.nombre); let contado=0;
  Object.values(D.gastos).forEach(g=>{ if(normH(g.proveedor)===k&&!g.pagoProv&&(!desde||g.fecha>=desde)) contado+=toNum(g.valor); });
  const credito=(p.cuentas||[]).filter(c=>!desde||c.fecha>=desde).reduce((s,c)=>s+toNum(c.valor),0);
  return contado+credito;
}
const provRepuestos=p=>repList().filter(r=>normH(r.proveedor)===normH(p.nombre));
function provSinFicha(){
  const nombres=new Map();
  [...Object.values(D.repuestos).map(r=>r.proveedor),...Object.values(D.gastos).filter(g=>g.categoria==='Repuestos y compras'||g.categoria==='Insumos (aceites, limpieza)').map(g=>g.proveedor)]
    .forEach(n=>{ n=String(n||'').trim(); if(n&&!provPorNombre(n)&&!nombres.has(normH(n))) nombres.set(normH(n),n); });
  return [...nombres.values()];
}
function provDatalist(){ return `<datalist id="dl-prov">${provList().map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist>`; }
function asegurarProveedor(nombre){
  nombre=String(nombre||'').trim(); if(!nombre) return null;
  let p=provPorNombre(nombre); if(p) return clone(p);
  p={id:uid(),nombre,nit:'',contacto:'',telefono:'',correo:'',direccion:'',productos:'',plazo:30,notas:'',cuentas:[],pagos:[],creado:nowISO()};
  return p;
}
function registrarCredito(nombre,valor,factura,desc,fecha){
  const p=asegurarProveedor(nombre); if(!p||!(valor>0)) return;
  p.cuentas=p.cuentas||[]; const f=fecha||todayKey(); const v=new Date(f+'T12:00:00'); v.setDate(v.getDate()+(toNum(p.plazo)||30));

      ${movs.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="n">Valor</th></tr></thead><tbody>
      ${movs.map(m=>`<tr><td style="white-space:nowrap">${new Date(m.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'})}</td><td><b>${m.tipo}</b>${m.det?`<div class="small muted">${esc(m.det)}</div>`:''}${m.vence?`<div class="small" style="color:${daysUntil(m.vence)<0?'var(--bad)':'var(--muted)'}">vence ${fDate(m.vence)}</div>`:''}</td><td class="n" style="color:${m.abono?'var(--ok)':m.cargo?'var(--warn)':'var(--muted)'}">${m.abono?'− '+money(m.abono):m.cargo?'+ '+money(m.cargo):money(m.contado)}</td></tr>`).join('')}
      </tbody></table></div>`:'<p class="muted">Sin compras registradas con este proveedor.</p>'}</section>
    <section class="card"><h3 style="margin-bottom:10px">Repuestos que suministra</h3>
      ${reps.length?`<div class="list">${reps.map(r=>{ const s=stockRep(r); return `<button class="li" data-go="repuesto" data-id="${r.id}"><span>${IC.box}</span><span><div class="t">${esc(r.nombre)}</div><div class="s">${esc([r.codigo,r.marca].filter(Boolean).join(' · '))} · costo ${money(r.costo)}</div></span><span class="r"><span class="chip ${s.disponible<=toNum(r.minimo)&&toNum(r.minimo)>0?'warn':'n'}">${numFmt.format(s.disponible)} disp.</span></span></button>`; }).join('')}</div>`:'<p class="muted small">Ningún repuesto tiene asignado este proveedor. Se asigna en la ficha de cada repuesto.</p>'}</section>
  </div>
  <form class="card stack" data-form="prov-edit"><h3>Datos del proveedor</h3>${provCampos(p)}
    <div class="row"><button class="btn dark" type="submit">Guardar cambios</button><button class="btn danger" type="button" data-act="prov-borrar" data-id="${p.id}">Eliminar</button></div></form></div>`;
}
function sugeridoPedido(r){ const s=stockRep(r); const m=toNum(r.minimo); return Math.max(1,Math.ceil(m*2-s.disponible)); }
function provCampos(p){ p=p||{};
  return `<label class="f"><span class="req">Nombre o razón social</span><input class="i" id="pv-nom" name="nombre" value="${esc(p.nombre||'')}" required></label>
  <div class="grid2">
    <label class="f">NIT<input class="i" id="pv-nit" name="nit" value="${esc(p.nit||'')}"></label>
    <label class="f">Persona de contacto<input class="i" id="pv-con" name="contacto" value="${esc(p.contacto||'')}"></label>
    <label class="f">Celular / WhatsApp<input class="i" id="pv-tel" name="telefono" value="${esc(p.telefono||'')}" inputmode="tel"></label>
    <label class="f">Correo<input class="i" id="pv-mail" name="correo" value="${esc(p.correo||'')}" type="email"></label>
    <label class="f">Plazo de pago (días)<input class="i num" id="pv-plazo" name="plazo" value="${esc(p.plazo??30)}" inputmode="numeric"></label>
    <label class="f">Qué vende<input class="i" id="pv-prod" name="productos" value="${esc(p.productos||'')}" placeholder="Frenos, suspensión…"></label>
  </div>
  <label class="f">Dirección<input class="i" id="pv-dir" name="direccion" value="${esc(p.direccion||'')}"></label>
  <label class="f">Notas<textarea class="i" id="pv-notas" name="notas" style="min-height:60px">${esc(p.notas||'')}</textarea></label>`;
}
function msgPedido(p){
  const cf=cfg(); let t=`Hola${p.contacto?' '+p.contacto.split(' ')[0]:''}, le saluda ${cf.nombre}. Queremos hacer el siguiente pedido:\n\n`;
  provRepuestos(p).filter(r=>bajoMinimo().includes(r)).forEach(r=>{ t+=`• ${numFmt.format(sugeridoPedido(r))} × ${r.nombre}${r.marca?' ('+r.marca+')':''}${r.codigo?' · ref. '+r.codigo:''}\n`; });
  t+=`\nPor favor confírmenos disponibilidad, precio y tiempo de entrega. ¡Gracias!`; return t;
}

document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]'); if(!a||ev.target.closest('[data-go]')&&!a.dataset.act.startsWith('prov')) return;
  switch(a.dataset.act){
    case 'prov-nuevo': modal(`<form data-form="prov-nuevo"><div class="mh"><h2>Nuevo proveedor</h2><button type="button" class="btn ghost" data-act="close">×</button></div><div class="stack">${provCampos({})}</div>
      <div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Crear proveedor</button></div></form>`); break;
    case 'prov-crear-fichas': { const l=provSinFicha(); l.forEach(n=>{ const p=asegurarProveedor(n); Store.put('proveedores',p); }); render(); toast(`${l.length} fichas creadas. Complete sus teléfonos y NIT.`); break; }
    case 'prov-borrar': { const p=D.proveedores[a.dataset.id]; confirmar('Eliminar proveedor',provSaldo(p)>0?`Todavía se le deben <b>${money(provSaldo(p))}</b>. Si lo elimina se pierde ese registro.`:'Se elimina la ficha. Los repuestos y gastos conservan el nombre.','Eliminar',()=>{ Store.del('proveedores',p.id); go('proveedores'); toast('Proveedor eliminado'); },true); break; }
    case 'prov-pagar': { const p=D.proveedores[a.dataset.id];
      modal(`<form data-form="prov-pago" data-id="${p.id}"><div class="mh"><h2>Pago a ${esc(p.nombre)}</h2><button type="button" class="btn ghost" data-act="close">×</button></div>
        <p>Saldo por pagar: <b>${money(provSaldo(p))}</b></p>
        <div class="grid2"><label class="f"><span class="req">Valor</span><input class="i num" id="pp-valor" name="valor" value="${numFmt.format(provSaldo(p))}" inputmode="numeric" required></label>
        <label class="f">Pagado con<select class="i" id="pp-medio" name="medio">${MEDIOS.map(x=>`<option>${x}</option>`).join('')}</select></label>
        <label class="f">Fecha<input class="i" type="date" id="pp-fecha" name="fecha" value="${todayKey()}"></label>
        <label class="f">Nota<input class="i" id="pp-nota" name="nota" placeholder="Abono factura…"></label></div>
        <p class="small muted">El pago queda también en Gastos, para que la caja cuadre.</p>
        <div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Registrar pago</button></div></form>`); setTimeout(()=>{ const i=$('#pp-valor'); i&&i.select(); },30); break; }
    case 'prov-credito': { const p=D.proveedores[a.dataset.id];
      modal(`<form data-form="prov-credito" data-id="${p.id}"><div class="mh"><h2>Compra a crédito</h2><button type="button" class="btn ghost" data-act="close">×</button></div>
        <p class="small muted" style="margin-top:0">Para facturas que no pasaron por Entrada de mercancía. Las entradas pagadas con "Crédito con el proveedor" se registran aquí solas.</p>
        <div class="grid2"><label class="f"><span class="req">Valor</span><input class="i num" id="pc-valor" name="valor" inputmode="numeric" required></label>
        <label class="f">N.º factura<input class="i" id="pc-fac" name="factura"></label>
        <label class="f">Fecha<input class="i" type="date" id="pc-fecha" name="fecha" value="${todayKey()}"></label>
        <label class="f">Detalle<input class="i" id="pc-desc" name="desc"></label></div>
        <div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Registrar</button></div></form>`); break; }
    case 'prov-pedido': { const p=D.proveedores[a.dataset.id]; modalWACliente(p,msgPedido(p),'Pedido a '+p.nombre); break; }
  }
});
document.addEventListener('submit',ev=>{
  const f=ev.target; const k=f.dataset.form; if(!k||!k.startsWith('prov')) return; ev.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  const datos=()=>({nombre:(fd.nombre||'').trim(),nit:(fd.nit||'').trim(),contacto:(fd.contacto||'').trim(),telefono:(fd.telefono||'').trim(),correo:(fd.correo||'').trim(),plazo:toNum(fd.plazo),productos:(fd.productos||'').trim(),direccion:(fd.direccion||'').trim(),notas:(fd.notas||'').trim()});
  if(k==='prov-nuevo'){ const d=datos(); if(provPorNombre(d.nombre)){ toast('Ya existe un proveedor con ese nombre.'); return; } const p=Object.assign({id:uid(),cuentas:[],pagos:[],creado:nowISO()},d); Store.put('proveedores',p); closeModal(); go('proveedor',p.id); toast('Proveedor creado'); return; }
  if(k==='prov-edit'){ const p=clone(D.proveedores[ui.id]); const viejo=p.nombre; Object.assign(p,datos()); Store.put('proveedores',p);
    if(normH(viejo)!==normH(p.nombre)) Object.values(D.repuestos).filter(r=>normH(r.proveedor)===normH(viejo)).forEach(r=>{ const x=clone(r); x.proveedor=p.nombre; Store.put('repuestos',x); });
    render(); toast('Proveedor actualizado'); return; }
  if(k==='prov-pago'){ const p=clone(D.proveedores[f.dataset.id]); const val=toNum(fd.valor); if(!(val>0)){ toast('Escriba un valor mayor a cero.'); return; }
    p.pagos=p.pagos||[]; p.pagos.push({id:uid(),fecha:fd.fecha||todayKey(),valor:val,medio:fd.medio,nota:fd.nota||''}); Store.put('proveedores',p);
    Store.put('gastos',{id:uid(),fecha:fd.fecha||todayKey(),valor:val,categoria:'Repuestos y compras',medio:fd.medio,descripcion:`Pago a proveedor ${p.nombre}${fd.nota?' · '+fd.nota:''}`,proveedor:p.nombre,pagoProv:true,otId:'',creado:nowISO()});
    closeModal(); render(); toast('Pago registrado'); return; }
  if(k==='prov-credito'){ const p=D.proveedores[f.dataset.id]; const val=toNum(fd.valor); if(!(val>0)){ toast('Escriba un valor mayor a cero.'); return; }
    registrarCredito(p.nombre,val,fd.factura,fd.desc,fd.fecha); closeModal(); render(); toast('Compra a crédito registrada'); return; }
});

// ---------- Arranque ----------
render();
Store.init(changed).then(()=>{ if(Store.ready()) render(); });
</script>

<div class="pwa-install" id="pwa-install" hidden><span>Instalar la app en este equipo</span><button class="ok" id="pwa-ok">Instalar</button><button class="no" id="pwa-no" aria-label="Ahora no">×</button></div>
<script>
// PWA: funciona sin internet e instalable en la pantalla de inicio
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let pwaEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); pwaEvt=e; try{ if(localStorage.getItem('pwa-no')) return; }catch(_){} document.getElementById('pwa-install').hidden=false; });
document.getElementById('pwa-ok').onclick=async()=>{ if(!pwaEvt) return; pwaEvt.prompt(); await pwaEvt.userChoice; pwaEvt=null; document.getElementById('pwa-install').hidden=true; };
document.getElementById('pwa-no').onclick=()=>{ document.getElementById('pwa-install').hidden=true; try{ localStorage.setItem('pwa-no','1'); }catch(_){} };
window.addEventListener('appinstalled',()=>{ document.getElementById('pwa-install').hidden=true; });
</script>
